name: Build release

# Builds the signed release APK on GitHub's servers from a version tag, publishes a build
# attestation for it, and attaches it to a DRAFT GitHub Release. Publishing the draft stays a
# manual step. Tags with a suffix (v0.1.0-beta.1) become pre-releases.
#
# Anyone can check that an APK was built here, from the tagged source:
#   gh attestation verify Quadern_<version>.apk -R aleixrodriala/quadern
#
# The signing key only exists in the `release` environment's secrets, which only `main` and
# `v*` tags can use: RELEASE_KEYSTORE_BASE64 (the .jks file, base64), RELEASE_KEYSTORE_PASSWORD,
# RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write      # create the draft release
      id-token: write      # sign the attestation
      attestations: write
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      # SHA-256 of the certificate every Quadern release is signed with.
      EXPECTED_CERT: 872113afa3f5294bd9a85a684f13ffa97d48cb854c618f6a683132deb5358d8f
      NDK_VERSION: 29.0.14206865   # app/build.gradle.kts ndkVersion
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No Gradle cache on purpose: a release build starts from nothing another run could have left.
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The release environment has no RELEASE_KEYSTORE_BASE64 secret."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test and build the release APK
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleRelease

      - name: Remove the signing key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Check version and signature
        run: |
          set -euo pipefail
          version="$(grep -oP 'val appVersion = "\K[^"]+' app/build.gradle.kts)$(grep -oP 'val appVersionSuffix = "\K[^"]*' app/build.gradle.kts)"
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match the app's version $version. Bump it first."
            exit 1
          fi
          name="Quadern_${TAG#v}"; [ -n "$TAG" ] || name="Quadern_${version}-${GITHUB_SHA::8}"
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$name.apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/[0-9]* | sort -V | tail -1)/apksigner"
          out="$("$apksigner" verify --print-certs "dist/$name.apk" 2>&1)" || { echo "$out"; echo "::error::apksigner rejected the APK."; exit 1; }
          certs="$(printf '%s\n' "$out" | grep -oE 'certificate SHA-256 digest: [0-9a-f]{64}' | awk '{print $4}' | sort -u)"
          if [ "$certs" != "$EXPECTED_CERT" ]; then
            echo "$out"
            echo "::error::The APK is signed with '${certs}', not Quadern's certificate."
            exit 1
          fi
          (cd dist && sha256sum -- *.apk > SHA256SUMS && cat SHA256SUMS)

      - name: Attest the build
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Keep the APK as a workflow artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Quadern-${{ env.TAG || github.sha }}
          if-no-files-found: ignore
          path: dist/
          retention-days: 14

      - name: Attach to a draft release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Named by versionCode, as app/build.gradle.kts computes it: 0.1.0-beta.2 -> 10002.
          base="$(grep -oP 'val appVersion = "\K[^"]+' app/build.gradle.kts | awk -F. '{print $1*10000+$2*100+$3}')"
          beta="$(grep -oP 'val appVersionSuffix = "-beta\.\K[0-9]+' app/build.gradle.kts || echo 99)"
          notes="fastlane/metadata/android/en-US/changelogs/$((base * 100 + beta)).txt"
          pre=""; case "$TAG" in *-*) pre="--prerelease" ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft $pre --title "Quadern ${TAG#v}" \
              $( [ -f "$notes" ] && echo --notes-file "$notes" || echo --generate-notes )
          fi
