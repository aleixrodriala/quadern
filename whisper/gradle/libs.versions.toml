# Standalone-only catalog. When :whisper is included from the app, the app's catalog is used, so
# every alias referenced by build.gradle.kts must exist there too (same names):
#   versions: compileSdk, minSdk   plugins: android-library
#   libraries: androidx-test-runner, androidx-test-ext-junit
[versions]
compileSdk = "37"
minSdk = "29"
agp = "9.3.2"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"

[libraries]
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
